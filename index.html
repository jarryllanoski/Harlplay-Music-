<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FL Web — Editor de Música</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070709;color:#ccc;font-family:monospace;overflow:hidden;height:100vh}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#07070a}
::-webkit-scrollbar-thumb{background:#1a1a2e;border-radius:3px}
button:active{filter:brightness(0.8)}
input[type=range]{cursor:pointer}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── CONSTANTS ──
const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const OCTAVES = [7,6,5,4,3,2];
const ALL_NOTES = OCTAVES.flatMap(o => [...NOTES].reverse().map(n => `${n}${o}`));
const NOTE_FREQS = {};
ALL_NOTES.forEach(note => {
  const n = note.slice(0,-1), o = parseInt(note.slice(-1));
  const idx = NOTES.indexOf(n);
  NOTE_FREQS[note] = 440 * Math.pow(2,(idx-9+(o-4)*12)/12);
});
const DRUM_PADS = [
  {name:"KICK", color:"#ff4d4d", type:"kick"},
  {name:"SNARE",color:"#ffaa00",type:"snare"},
  {name:"HIHAT",color:"#00e5ff",type:"hihat"},
  {name:"CLAP", color:"#b44dff",type:"clap"},
  {name:"OPEN", color:"#00ff9f",type:"open"},
  {name:"RIDE", color:"#ff69b4",type:"ride"},
];
const BEAT_STEPS = 16;
const PR_COLS = 32;
const CW = 24, CH = 13;
const TRACK_COLORS = ["#ff4d4d","#ffaa00","#00e5ff","#b44dff","#00ff9f","#ff69b4","#7fffd4","#ffd700"];
const DEFAULT_SYNTH = {wave:"sawtooth",attack:0.01,decay:0.1,sustain:0.6,release:0.2,cutoff:2000,filterType:"lowpass"};

// ── AUDIO ──
let _ctx=null,_master=null;
function getAudio(){
  if(!_ctx){
    _ctx=new(window.AudioContext||window.webkitAudioContext)();
    _master=_ctx.createGain(); _master.gain.value=0.7; _master.connect(_ctx.destination);
  }
  return{ctx:_ctx,master:_master};
}
function resume(){const{ctx}=getAudio();if(ctx.state==="suspended")ctx.resume();}

function playNote(freq,dur=0.3,s={}){
  resume();
  const{ctx,master}=getAudio();
  const{wave="sawtooth",attack=0.01,decay=0.1,sustain=0.6,release=0.2,cutoff=2000,filterType="lowpass"}=s;
  const osc=ctx.createOscillator(),env=ctx.createGain(),flt=ctx.createBiquadFilter();
  flt.type=filterType; flt.frequency.value=cutoff;
  osc.type=wave; osc.frequency.value=freq;
  osc.connect(flt); flt.connect(env); env.connect(master);
  const now=ctx.currentTime;
  env.gain.setValueAtTime(0,now);
  env.gain.linearRampToValueAtTime(0.8,now+attack);
  env.gain.linearRampToValueAtTime(sustain*0.8,now+attack+decay);
  env.gain.setValueAtTime(sustain*0.8,now+dur-release);
  env.gain.linearRampToValueAtTime(0,now+dur+release);
  osc.start(now); osc.stop(now+dur+release+0.05);
}

function playDrum(type){
  resume();
  const{ctx,master}=getAudio();
  const g=ctx.createGain(); g.connect(master);
  const now=ctx.currentTime;
  if(type==="kick"){
    const o=ctx.createOscillator(); o.connect(g);
    o.frequency.setValueAtTime(120,now); o.frequency.exponentialRampToValueAtTime(20,now+0.5);
    g.gain.setValueAtTime(1,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.5);
    o.start(now); o.stop(now+0.5);
  } else if(type==="snare"){
    const b=ctx.createBuffer(1,ctx.sampleRate*0.15,ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=b;
    const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=1500;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.8,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.15);
    s.start(now); s.stop(now+0.15);
  } else if(type==="hihat"){
    const b=ctx.createBuffer(1,ctx.sampleRate*0.04,ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=b;
    const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=8000;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.4,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.04);
    s.start(now); s.stop(now+0.04);
  } else if(type==="clap"){
    for(let i=0;i<3;i++){
      const b=ctx.createBuffer(1,ctx.sampleRate*0.04,ctx.sampleRate);
      const d=b.getChannelData(0); for(let j=0;j<d.length;j++) d[j]=Math.random()*2-1;
      const s=ctx.createBufferSource(); s.buffer=b;
      const gg=ctx.createGain(); gg.connect(master);
      gg.gain.setValueAtTime(0.5,now+i*0.012); gg.gain.exponentialRampToValueAtTime(0.001,now+i*0.012+0.04);
      s.connect(gg); s.start(now+i*0.012); s.stop(now+i*0.012+0.04);
    }
  } else if(type==="open"){
    const b=ctx.createBuffer(1,ctx.sampleRate*0.3,ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=b;
    const f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=6000;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.4,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.3);
    s.start(now); s.stop(now+0.3);
  } else if(type==="ride"){
    const b=ctx.createBuffer(1,ctx.sampleRate*0.2,ctx.sampleRate);
    const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=ctx.createBufferSource(); s.buffer=b;
    const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=5000; f.Q.value=0.5;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(0.35,now); g.gain.exponentialRampToValueAtTime(0.001,now+0.2);
    s.start(now); s.stop(now+0.2);
  }
}

// ── PIANO ROLL ──
function PianoRoll({notes,onChange,synth}){
  const toggle=(ni,ci)=>{
    const k=`${ni}_${ci}`, next=new Set(notes);
    if(next.has(k)) next.delete(k);
    else{ next.add(k); playNote(NOTE_FREQS[ALL_NOTES[ni]],0.3,synth); }
    onChange(next);
  };
  return (
    <div style={{display:"flex",overflow:"auto",maxHeight:300,border:"1px solid #111"}}>
      <div style={{width:40,flexShrink:0}}>
        {ALL_NOTES.map((note,ni)=>{
          const isB=note.includes("#");
          return <div key={ni} onClick={()=>playNote(NOTE_FREQS[note],0.4,synth)} style={{
            height:CH,background:isB?"#111":"#e8e8e8",border:"1px solid #222",
            cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"flex-end",
            paddingRight:2,fontSize:7,color:isB?"#555":"#999",flexShrink:0
          }}>{note.includes("C")&&!note.includes("#")?note:""}</div>;
        })}
      </div>
      <div style={{position:"relative",cursor:"crosshair"}}>
        {ALL_NOTES.map((note,ni)=>{
          const isB=note.includes("#");
          return <div key={ni} style={{display:"flex"}}>
            {Array.from({length:PR_COLS}).map((_,ci)=>{
              const active=notes.has(`${ni}_${ci}`);
              return <div key={ci} onClick={()=>toggle(ni,ci)} style={{
                width:CW,height:CH,flexShrink:0,
                background:active?"#00e5ff":isB?(ci%4===0?"#141420":"#0f0f1a"):(ci%4===0?"#1a1a2e":"#13131f"),
                borderRight:`1px solid ${ci%4===3?"#2a2a3e":"#0d0d18"}`,
                borderBottom:"1px solid #0d0d18",
                boxShadow:active?"inset 0 0 5px rgba(0,229,255,0.4)":"none"
              }}/>;
            })}
          </div>;
        })}
      </div>
    </div>
  );
}

// ── BEAT GRID ──
function BeatGrid({grid,onToggle,currentStep,playing}){
  return <div>{DRUM_PADS.map((pad,pi)=>(
    <div key={pi} style={{display:"flex",alignItems:"center",gap:2,marginBottom:3}}>
      <div style={{width:38,fontSize:8,color:pad.color,textAlign:"right",paddingRight:4,flexShrink:0,letterSpacing:1}}>{pad.name}</div>
      <div style={{display:"flex",gap:2}}>
        {Array.from({length:BEAT_STEPS}).map((_,si)=>{
          const active=grid[pi]?.[si],cur=playing&&si===currentStep;
          return <div key={si} onClick={()=>onToggle(pi,si)} style={{
            width:20,height:20,borderRadius:3,cursor:"pointer",
            background:active?(cur?pad.color:`${pad.color}88`):cur?"#1a1a2e":"#0d0d18",
            border:`1px solid ${active?pad.color:si%4===0?"#1a1a2e":"#111"}`,
            boxShadow:active&&cur?`0 0 5px ${pad.color}`:"none",transition:"all 0.05s"
          }}/>;
        })}
      </div>
    </div>
  ))}</div>;
}

// ── SYNTH PANEL ──
function SynthPanel({synth,onChange}){
  const Knob=({label,param,min,max,step=0.01,color="#00e5ff",fmt})=>{
    const v=synth[param],pct=((v-min)/(max-min))*100;
    const display=fmt?fmt(v):v.toFixed(2);
    return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
      <div style={{width:34,height:34,borderRadius:"50%",
        background:`conic-gradient(${color} 0% ${pct}%, #111 ${pct}% 100%)`,
        display:"flex",alignItems:"center",justifyContent:"center",
        boxShadow:`0 0 5px ${color}33`}}>
        <div style={{width:24,height:24,borderRadius:"50%",background:"#0a0a0f",
          display:"flex",alignItems:"center",justifyContent:"center",
          fontSize:7,color:"#888"}}>{display}</div>
      </div>
      <input type="range" min={min} max={max} step={step} value={v}
        onChange={e=>onChange({...synth,[param]:parseFloat(e.target.value)})}
        style={{width:44,accentColor:color}}/>
      <span style={{fontSize:7,color:"#444",letterSpacing:1}}>{label}</span>
    </div>;
  };
  return <div style={{display:"flex",gap:12,flexWrap:"wrap"}}>
    <div style={{background:"#0d0d18",border:"1px solid #1a1a2e",borderRadius:6,padding:10}}>
      <div style={{fontSize:8,color:"#444",letterSpacing:3,marginBottom:8}}>OSCILADOR</div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
        {["sine","triangle","sawtooth","square"].map(w=>(
          <button key={w} onClick={()=>onChange({...synth,wave:w})} style={{
            padding:"3px 7px",border:`1px solid ${synth.wave===w?"#00e5ff":"#1a1a2e"}`,
            background:synth.wave===w?"rgba(0,229,255,0.1)":"transparent",
            color:synth.wave===w?"#00e5ff":"#444",fontSize:8,cursor:"pointer",borderRadius:3
          }}>{w.slice(0,3).toUpperCase()}</button>
        ))}
      </div>
    </div>
    <div style={{background:"#0d0d18",border:"1px solid #1a1a2e",borderRadius:6,padding:10}}>
      <div style={{fontSize:8,color:"#444",letterSpacing:3,marginBottom:8}}>ADSR</div>
      <div style={{display:"flex",gap:10}}>
        <Knob label="ATK" param="attack" min={0.001} max={2} color="#ffaa00"/>
        <Knob label="DEC" param="decay" min={0.01} max={2} color="#ff69b4"/>
        <Knob label="SUS" param="sustain" min={0} max={1} color="#00ff9f"/>
        <Knob label="REL" param="release" min={0.01} max={3} color="#b44dff"/>
      </div>
    </div>
    <div style={{background:"#0d0d18",border:"1px solid #1a1a2e",borderRadius:6,padding:10}}>
      <div style={{fontSize:8,color:"#444",letterSpacing:3,marginBottom:8}}>FILTRO</div>
      <div style={{display:"flex",gap:4,marginBottom:6}}>
        {["lowpass","highpass","bandpass"].map(f=>(
          <button key={f} onClick={()=>onChange({...synth,filterType:f})} style={{
            padding:"2px 5px",border:`1px solid ${synth.filterType===f?"#b44dff":"#1a1a2e"}`,
            background:synth.filterType===f?"rgba(180,77,255,0.1)":"transparent",
            color:synth.filterType===f?"#b44dff":"#444",fontSize:7,cursor:"pointer",borderRadius:3
          }}>{f.slice(0,2).toUpperCase()}</button>
        ))}
      </div>
      <Knob label="CUTOFF" param="cutoff" min={100} max={8000} step={10} color="#b44dff"
        fmt={v=>v>=1000?`${(v/1000).toFixed(1)}k`:Math.round(v)}/>
    </div>
  </div>;
}

// ── SONG EDITOR ──
function SongEditor({tracks,songMap,onToggle,playhead,playing}){
  return <div style={{overflowX:"auto"}}>
    {tracks.map((track,ti)=>(
      <div key={ti} style={{display:"flex",alignItems:"center",marginBottom:3}}>
        <div style={{width:80,flexShrink:0,fontSize:8,color:TRACK_COLORS[ti%TRACK_COLORS.length],
          fontFamily:"monospace",paddingRight:6,textAlign:"right",overflow:"hidden",
          textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{track.name}</div>
        <div style={{display:"flex",gap:2}}>
          {Array.from({length:32}).map((_,ci)=>{
            const active=songMap[ti]?.[ci];
            const color=TRACK_COLORS[ti%TRACK_COLORS.length];
            const cur=playing&&ci===playhead;
            return <div key={ci} onClick={()=>onToggle(ti,ci)} style={{
              width:18,height:22,borderRadius:2,cursor:"pointer",
              background:active?`${color}99`:cur?"#1a1a2e":"#0d0d18",
              border:`1px solid ${active?color:cur?"#333":"#111"}`,
              boxShadow:active&&cur?`0 0 6px ${color}`:"none"
            }}/>;
          })}
        </div>
      </div>
    ))}
    <div style={{display:"flex",marginLeft:86}}>
      {Array.from({length:32}).map((_,i)=>(
        <div key={i} style={{width:18,textAlign:"center",fontSize:7,
          color:i%4===0?"#444":"#222",marginRight:2}}>{i%4===0?i/4+1:""}</div>
      ))}
    </div>
  </div>;
}

// ── MIXER CHANNEL ──
function MixerChannel({track,index,onChange}){
  const color=TRACK_COLORS[index%TRACK_COLORS.length];
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,
    padding:"8px 6px",background:"#0a0a0f",border:"1px solid #111",
    borderTop:`3px solid ${color}`,borderRadius:4,minWidth:46}}>
    <div style={{fontSize:7,color,letterSpacing:1,textAlign:"center",maxWidth:42,
      overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{track.name}</div>
    <input type="range" min={0} max={1.5} step={0.01} value={track.volume}
      onChange={e=>onChange(index,"volume",parseFloat(e.target.value))}
      style={{writingMode:"vertical-lr",direction:"rtl",height:70,accentColor:color}}/>
    <span style={{fontSize:7,color:"#444"}}>{Math.round(track.volume*100)}</span>
    <input type="range" min={-1} max={1} step={0.05} value={track.pan||0}
      onChange={e=>onChange(index,"pan",parseFloat(e.target.value))}
      style={{width:40,accentColor:"#888"}}/>
    <button onClick={()=>onChange(index,"muted",!track.muted)} style={{
      width:28,height:16,border:`1px solid ${track.muted?"#ff4d4d":"#222"}`,
      background:track.muted?"rgba(255,77,77,0.2)":"transparent",
      color:track.muted?"#ff4d4d":"#444",fontSize:7,cursor:"pointer",borderRadius:2}}>M</button>
    <button onClick={()=>onChange(index,"solo",!track.solo)} style={{
      width:28,height:16,border:`1px solid ${track.solo?"#ffaa00":"#222"}`,
      background:track.solo?"rgba(255,170,0,0.2)":"transparent",
      color:track.solo?"#ffaa00":"#444",fontSize:7,cursor:"pointer",borderRadius:2}}>S</button>
  </div>;
}

// ── MAIN APP ──
function makeTrack(name,type){return{name,type,volume:1,pan:0,muted:false,solo:false};}

function App(){
  const [tab,setTab]=useState("song");
  const [bpm,setBpm]=useState(128);
  const [playing,setPlaying]=useState(false);
  const [playhead,setPlayhead]=useState(0);
  const [editingTrack,setEditingTrack]=useState(0);
  const [beatStep,setBeatStep]=useState(-1);

  const [tracks,setTracks]=useState([
    makeTrack("MELODY","synth"),
    makeTrack("BASS","synth"),
    makeTrack("DRUMS","beat"),
    makeTrack("PAD","synth"),
  ]);

  const [synthSettings,setSynthSettings]=useState({
    0:{...DEFAULT_SYNTH,wave:"sawtooth",cutoff:3000},
    1:{...DEFAULT_SYNTH,wave:"sine",cutoff:800},
    2:{...DEFAULT_SYNTH},
    3:{...DEFAULT_SYNTH,wave:"sine",attack:0.3,release:0.8,cutoff:1200},
  });

  const [pianoNotes,setPianoNotes]=useState({0:new Set(),1:new Set(),2:new Set(),3:new Set()});

  const [beatGrids,setBeatGrids]=useState({
    2:Array.from({length:DRUM_PADS.length},()=>Array(BEAT_STEPS).fill(false))
  });

  const [songMap,setSongMap]=useState(()=>{
    const m={};
    [0,1,2,3].forEach(ti=>{m[ti]=Array(32).fill(false);});
    return m;
  });

  const beatRef=useRef(null);

  const stopPlay=useCallback(()=>{
    clearInterval(beatRef.current);
    setPlaying(false); setBeatStep(-1); setPlayhead(0);
  },[]);

  const startPlay=useCallback(()=>{
    resume();
    setPlaying(true);
    const stepMs=(60/bpm/4)*1000;
    let step=0;
    beatRef.current=setInterval(()=>{
      const bs=step%BEAT_STEPS;
      setBeatStep(bs);
      const beatGrid=beatGrids[2];
      if(beatGrid) beatGrid.forEach((row,pi)=>{ if(row[bs]) playDrum(DRUM_PADS[pi].type); });
      if(bs===0){
        const col=Math.floor(step/BEAT_STEPS)%32;
        setPlayhead(col);
        tracks.forEach((track,ti)=>{
          if(track.muted||!songMap[ti]?.[col]||track.type!=="synth") return;
          const notes=pianoNotes[ti]; if(!notes||notes.size===0) return;
          const synth=synthSettings[ti]||DEFAULT_SYNTH;
          const noteDur=(60/bpm)*0.45;
          notes.forEach(key=>{
            const[ni,ci]=key.split("_").map(Number);
            setTimeout(()=>playNote(NOTE_FREQS[ALL_NOTES[ni]],noteDur,synth),ci*stepMs);
          });
        });
      }
      step++;
    },stepMs);
  },[bpm,beatGrids,tracks,songMap,pianoNotes,synthSettings]);

  useEffect(()=>()=>clearInterval(beatRef.current),[]);

  const toggleSong=(ti,ci)=>setSongMap(prev=>{
    const next={...prev}; next[ti]=[...(next[ti]||Array(32).fill(false))];
    next[ti][ci]=!next[ti][ci]; return next;
  });

  const toggleBeat=(pi,si)=>setBeatGrids(prev=>{
    const grid=prev[editingTrack]||Array.from({length:DRUM_PADS.length},()=>Array(BEAT_STEPS).fill(false));
    const next=grid.map(r=>[...r]); next[pi][si]=!next[pi][si];
    return{...prev,[editingTrack]:next};
  });

  const updateTrack=(idx,key,val)=>setTracks(prev=>prev.map((t,i)=>i===idx?{...t,[key]:val}:t));

  const addTrack=()=>{
    const idx=tracks.length;
    setTracks(prev=>[...prev,makeTrack(`TRACK ${idx+1}`,"synth")]);
    setSynthSettings(prev=>({...prev,[idx]:{...DEFAULT_SYNTH}}));
    setPianoNotes(prev=>({...prev,[idx]:new Set()}));
    setSongMap(prev=>{const n={...prev};n[idx]=Array(32).fill(false);return n;});
  };

  const currentBeatGrid=beatGrids[editingTrack]||Array.from({length:DRUM_PADS.length},()=>Array(BEAT_STEPS).fill(false));
  const editTrack=tracks[editingTrack];

  const TABS=[
    {id:"song",label:"⊞ SONG"},
    {id:"piano",label:"♩ PIANO"},
    {id:"beat",label:"◈ BEATS"},
    {id:"synth",label:"≋ SYNTH"},
    {id:"mixer",label:"▤ MIXER"},
  ];

  return <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"#070709"}}>
    {/* TITLE BAR */}
    <div style={{background:"#0a0a0e",borderBottom:"1px solid #111",padding:"0 12px",
      display:"flex",alignItems:"center",gap:12,height:42,flexShrink:0,overflowX:"auto"}}>
      <div style={{fontSize:14,letterSpacing:6,color:"#fff",fontWeight:"bold",flexShrink:0}}>
        FL<span style={{color:"#ffaa00"}}>WEB</span>
      </div>
      <div style={{width:1,height:20,background:"#1a1a2e",flexShrink:0}}/>
      <button onClick={playing?stopPlay:startPlay} style={{
        padding:"4px 12px",flexShrink:0,
        border:`1px solid ${playing?"#ff4d4d":"#00e5ff"}`,
        background:playing?"rgba(255,77,77,0.15)":"rgba(0,229,255,0.1)",
        color:playing?"#ff4d4d":"#00e5ff",
        fontSize:11,cursor:"pointer",borderRadius:3,letterSpacing:2
      }}>{playing?"⏹ STOP":"▶ PLAY"}</button>
      <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
        <button onClick={()=>setBpm(b=>Math.max(60,b-1))} style={{
          width:18,height:18,border:"1px solid #1a1a2e",background:"#0d0d18",
          color:"#888",cursor:"pointer",borderRadius:2,fontSize:12}}>−</button>
        <div style={{background:"#000",border:"1px solid #1a1a2e",padding:"2px 8px",
          fontSize:15,color:"#ffaa00",letterSpacing:2,borderRadius:3,minWidth:48,textAlign:"center"}}>{bpm}</div>
        <button onClick={()=>setBpm(b=>Math.min(200,b+1))} style={{
          width:18,height:18,border:"1px solid #1a1a2e",background:"#0d0d18",
          color:"#888",cursor:"pointer",borderRadius:2,fontSize:12}}>+</button>
        <span style={{fontSize:8,color:"#333",letterSpacing:2}}>BPM</span>
      </div>
      <div style={{flex:1}}/>
      <span style={{fontSize:9,color:"#333",letterSpacing:2,flexShrink:0}}>BAR <span style={{color:"#555"}}>{playhead+1}</span></span>
    </div>

    {/* MAIN */}
    <div style={{display:"flex",flex:1,overflow:"hidden"}}>
      {/* SIDEBAR */}
      <div style={{width:130,background:"#09090d",borderRight:"1px solid #111",
        display:"flex",flexDirection:"column",flexShrink:0,overflowY:"auto"}}>
        <div style={{padding:"7px 8px",fontSize:8,color:"#333",letterSpacing:3,borderBottom:"1px solid #111"}}>TRACKS</div>
        {tracks.map((track,ti)=>(
          <div key={ti} onClick={()=>setEditingTrack(ti)} style={{
            padding:"7px 8px",cursor:"pointer",
            background:editingTrack===ti?"#0f0f18":"transparent",
            borderLeft:`2px solid ${editingTrack===ti?TRACK_COLORS[ti%TRACK_COLORS.length]:"transparent"}`,
            borderBottom:"1px solid #0d0d0d",display:"flex",alignItems:"center",gap:6
          }}>
            <div style={{width:7,height:7,borderRadius:"50%",
              background:TRACK_COLORS[ti%TRACK_COLORS.length],flexShrink:0}}/>
            <div>
              <div style={{fontSize:9,color:editingTrack===ti?"#fff":"#666",letterSpacing:1}}>{track.name}</div>
              <div style={{fontSize:7,color:"#333",marginTop:1}}>{track.type.toUpperCase()}</div>
            </div>
          </div>
        ))}
        <button onClick={addTrack} style={{
          margin:8,padding:"5px 0",border:"1px dashed #1a1a2e",
          background:"transparent",color:"#333",fontSize:8,cursor:"pointer",borderRadius:3,letterSpacing:2
        }}>+ TRACK</button>
      </div>

      {/* CENTER */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* TABS */}
        <div style={{display:"flex",borderBottom:"1px solid #111",background:"#09090d",flexShrink:0,overflowX:"auto"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setTab(t.id)} style={{
              padding:"7px 12px",border:"none",background:"transparent",
              color:tab===t.id?"#fff":"#333",fontSize:9,letterSpacing:2,cursor:"pointer",
              borderBottom:tab===t.id?"2px solid #ffaa00":"2px solid transparent",
              whiteSpace:"nowrap"
            }}>{t.label}</button>
          ))}
        </div>

        {/* CONTENT */}
        <div style={{flex:1,overflow:"auto",padding:14}}>

          {tab==="song"&&<div>
            <div style={{fontSize:8,color:"#333",letterSpacing:3,marginBottom:10}}>
              SONG EDITOR — activa bloques para indicar cuándo suena cada pista
            </div>
            <SongEditor tracks={tracks} songMap={songMap} onToggle={toggleSong} playhead={playhead} playing={playing}/>
          </div>}

          {tab==="piano"&&<div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <span style={{fontSize:8,color:"#333",letterSpacing:3}}>PIANO ROLL —</span>
              <span style={{fontSize:9,color:TRACK_COLORS[editingTrack%TRACK_COLORS.length]}}>{editTrack?.name}</span>
              <button onClick={()=>setPianoNotes(p=>({...p,[editingTrack]:new Set()}))} style={{
                marginLeft:"auto",padding:"3px 9px",border:"1px solid #1a1a2e",
                background:"transparent",color:"#444",fontSize:8,cursor:"pointer",borderRadius:3
              }}>LIMPIAR</button>
            </div>
            <PianoRoll
              notes={pianoNotes[editingTrack]||new Set()}
              onChange={notes=>setPianoNotes(p=>({...p,[editingTrack]:notes}))}
              synth={synthSettings[editingTrack]||DEFAULT_SYNTH}/>
            <div style={{marginTop:8,fontSize:8,color:"#333"}}>{pianoNotes[editingTrack]?.size||0} notas</div>
          </div>}

          {tab==="beat"&&<div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
              <span style={{fontSize:8,color:"#333",letterSpacing:3}}>BEAT MAKER —</span>
              <span style={{fontSize:9,color:TRACK_COLORS[editingTrack%TRACK_COLORS.length]}}>{editTrack?.name}</span>
              <button onClick={()=>setBeatGrids(p=>({...p,[editingTrack]:Array.from({length:DRUM_PADS.length},()=>Array(BEAT_STEPS).fill(false))}))} style={{
                marginLeft:"auto",padding:"3px 9px",border:"1px solid #1a1a2e",
                background:"transparent",color:"#444",fontSize:8,cursor:"pointer",borderRadius:3
              }}>LIMPIAR</button>
            </div>
            <BeatGrid grid={currentBeatGrid} onToggle={toggleBeat} currentStep={beatStep} playing={playing}/>
            <div style={{marginTop:10,display:"flex",gap:6,flexWrap:"wrap"}}>
              {[
                {name:"BÁSICO",fn:()=>{
                  const g=Array.from({length:DRUM_PADS.length},()=>Array(BEAT_STEPS).fill(false));
                  g[0][0]=g[0][8]=true; g[1][4]=g[1][12]=true;
                  [0,2,4,6,8,10,12,14].forEach(i=>g[2][i]=true);
                  setBeatGrids(p=>({...p,[editingTrack]:g}));
                }},
                {name:"TRAP",fn:()=>{
                  const g=Array.from({length:DRUM_PADS.length},()=>Array(BEAT_STEPS).fill(false));
                  g[0][0]=g[0][6]=g[0][10]=true; g[1][4]=g[1][12]=true;
                  [0,1,2,4,5,6,8,9,10,12,13,14].forEach(i=>g[2][i]=true);
                  setBeatGrids(p=>({...p,[editingTrack]:g}));
                }},
                {name:"REGGAETON",fn:()=>{
                  const g=Array.from({length:DRUM_PADS.length},()=>Array(BEAT_STEPS).fill(false));
                  g[0][0]=g[0][3]=g[0][6]=g[0][9]=g[0][12]=true;
                  g[1][2]=g[1][6]=g[1][10]=g[1][14]=true;
                  [0,2,4,6,8,10,12,14].forEach(i=>g[2][i]=true);
                  setBeatGrids(p=>({...p,[editingTrack]:g}));
                }},
              ].map(p=>(
                <button key={p.name} onClick={p.fn} style={{
                  padding:"4px 10px",border:"1px solid #1a1a2e",background:"transparent",
                  color:"#444",fontSize:8,cursor:"pointer",borderRadius:3,letterSpacing:1
                }}>{p.name}</button>
              ))}
            </div>
          </div>}

          {tab==="synth"&&<div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:14}}>
              <span style={{fontSize:8,color:"#333",letterSpacing:3}}>SINTETIZADOR —</span>
              <span style={{fontSize:9,color:TRACK_COLORS[editingTrack%TRACK_COLORS.length]}}>{editTrack?.name}</span>
            </div>
            <SynthPanel
              synth={synthSettings[editingTrack]||DEFAULT_SYNTH}
              onChange={s=>setSynthSettings(p=>({...p,[editingTrack]:s}))}/>
            <div style={{marginTop:18}}>
              <div style={{fontSize:8,color:"#333",letterSpacing:3,marginBottom:8}}>TECLADO — toca notas</div>
              <div style={{display:"flex",gap:1,overflowX:"auto"}}>
                {["C3","D3","E3","F3","G3","A3","B3","C4","D4","E4","F4","G4","A4","B4","C5","D5","E5"].map(note=>(
                  <button key={note} onClick={()=>playNote(NOTE_FREQS[note],0.5,synthSettings[editingTrack]||DEFAULT_SYNTH)} style={{
                    width:28,height:80,background:"#e8e8e8",border:"1px solid #333",
                    borderRadius:"0 0 3px 3px",cursor:"pointer",color:"#999",fontSize:7,
                    fontFamily:"monospace",display:"flex",alignItems:"flex-end",
                    justifyContent:"center",paddingBottom:3,flexShrink:0
                  }}>{note}</button>
                ))}
              </div>
            </div>
          </div>}

          {tab==="mixer"&&<div>
            <div style={{fontSize:8,color:"#333",letterSpacing:3,marginBottom:14}}>MEZCLADORA</div>
            <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:6}}>
              {tracks.map((track,ti)=>(
                <MixerChannel key={ti} track={track} index={ti} onChange={updateTrack}/>
              ))}
              <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:5,
                padding:"8px 6px",background:"#0a0a0f",border:"1px solid #222",
                borderTop:"3px solid #fff",borderRadius:4,minWidth:46}}>
                <div style={{fontSize:7,color:"#888",letterSpacing:1}}>MASTER</div>
                <input type="range" min={0} max={1.5} step={0.01} defaultValue={0.7}
                  onChange={e=>{if(_master)_master.gain.value=parseFloat(e.target.value);}}
                  style={{writingMode:"vertical-lr",direction:"rtl",height:70,accentColor:"#fff"}}/>
              </div>
            </div>
          </div>}

        </div>
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
